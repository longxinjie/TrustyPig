name: TrustyPig CI Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run ML pipeline tests
        run: |
          python -m pytest tests/

      - name: Run ML smoke validation
        run: |
          python ci/smoke_validate_model.py

      - name: Package model and app artifacts
        run: |
          python ci/package_artifacts.py

      - name: Create CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# TrustyPig Pipeline CI Report" > report.md
          echo "" >> report.md
          echo "## CI Validation Checks" >> report.md
          echo "| Check | Status |" >> report.md
          echo "|---|---|" >> report.md
          echo "| Model loads correctly | Passed |" >> report.md
          echo "| Feature schema validation | Passed |" >> report.md
          echo "| Prediction pipeline works | Passed |" >> report.md
          echo "| Probability output range | Passed |" >> report.md
          echo "| Smoke inference test | Passed |" >> report.md
          echo "| Artifact packaging | Passed |" >> report.md
          echo "" >> report.md
          echo "## Smoke Test Metrics" >> report.md
          cat ci_outputs/metrics.json >> report.md
          echo "" >> report.md
          echo "## Confusion Matrix" >> report.md
          cml publish ci_outputs/confusion_matrix.png --md >> report.md
          echo "" >> report.md
          echo "## Pipeline CI Decision" >> report.md
          echo "**Approved for Pipeline CD**" >> report.md
          cat report.md

      - name: Upload CI package
        uses: actions/upload-artifact@v4
        with:
          name: trusty-pig-ci-package
          path: ci_package/

      - name: Upload CML report and visuals
        uses: actions/upload-artifact@v4
        with:
          name: trusty-pig-cml-report
          path: |
            report.md
            ci_outputs/