name: TrustyPig CI Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run ML pipeline tests
        run: |
          python -m pytest tests/

      - name: Package model and app artifacts
        run: |
          python ci/package_artifacts.py

      - name: Create CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# TrustyPig Pipeline CI Report" > report.md
          echo "" >> report.md
          echo "## CI Stages Executed" >> report.md
          echo "| Stage | Status |" >> report.md
          echo "|---|---|" >> report.md
          echo "| Build Environment | Passed |" >> report.md
          echo "| ML Pipeline Tests | Passed |" >> report.md
          echo "| Artifact Packaging | Passed |" >> report.md
          echo "" >> report.md
          echo "## Pipeline CI Decision" >> report.md
          echo "**Approved for Pipeline CD**" >> report.md

          cml publish report.md --md

      - name: Upload CI package
        uses: actions/upload-artifact@v4
        with:
          name: trusty-pig-ci-package
          path: ci_package/

      - name: Upload CML report
        uses: actions/upload-artifact@v4
        with:
          name: trusty-pig-cml-report
          path: report.md