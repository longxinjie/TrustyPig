name: TrustyPig CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit and integration tests
        run: |
          pytest tests/

      - name: Package pipeline artifacts
        run: |
          python ci/package_artifacts.py

      - name: Upload CI package
        uses: actions/upload-artifact@v4
        with:
          name: trustypig-ci-package
          path: ci_package/