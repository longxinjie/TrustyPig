name: TrustyPig CI Pipeline

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup CML
        uses: iterative/setup-cml@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run ML pipeline tests
        run: |
          python -m pytest tests/

      - name: Run ML smoke validation
        run: |
          python ci/smoke_validate_model.py

      - name: Package model and app artifacts
        run: |
          python ci/package_artifacts.py

      - name: Create dynamic CML report
        run: |
          python ci/create_cml_report.py

      - name: Publish CML report as PR comment
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md

      - name: Upload CI package
        uses: actions/upload-artifact@v4
        with:
          name: trusty-pig-ci-package
          path: ci_package/

      - name: Upload CML report and visuals
        uses: actions/upload-artifact@v4
        with:
          name: trusty-pig-cml-report
          path: |
            report.md
            ci_outputs/

      - name: Trigger ClearML CD Pipeline
        if: success()
        env:
          CLEARML_API_ACCESS_KEY: ${{ secrets.CLEARML_API_ACCESS_KEY }}
          CLEARML_API_SECRET_KEY: ${{ secrets.CLEARML_API_SECRET_KEY }}
          CLEARML_API_HOST: ${{ secrets.CLEARML_API_HOST }}
          CLEARML_WEB_HOST: ${{ secrets.CLEARML_WEB_HOST }}
          CLEARML_FILES_HOST: ${{ secrets.CLEARML_FILES_HOST }}
          MODEL_VERSION: v2
        run: |
          python cd/pipeline_cd.py