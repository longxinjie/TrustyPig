name: TrustyPig CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/

      - name: Package artifacts
        run: |
          python ci/package_artifacts.py

      - name: Install CML
        run: |
          npm install -g @dvcorg/cml

      - name: Create CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## TrustyPig Pipeline CI Report" > report.md
          echo "" >> report.md
          echo "✅ Build completed: dependencies installed" >> report.md
          echo "✅ Tests passed: pytest tests/" >> report.md
          echo "✅ Package completed: artifacts generated" >> report.md
          cml comment create report.md