name: TrustyPig CI Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/

      - name: Package artifacts
        run: |
          python ci/package_artifacts.py

      - name: Install CML
        run: |
          npm install -g @dvcorg/cml

      - name: Create CML report
        run: |
          echo "## TrustyPig Pipeline CI Report" > report.md
          echo "" >> report.md
          echo "✅ Build completed: dependencies installed" >> report.md
          echo "✅ Tests passed: pytest tests/" >> report.md
          echo "✅ Package completed: artifacts generated" >> report.md
          echo "" >> report.md
          echo "### Pipeline CI Status" >> report.md
          echo "The TrustyPig ML pipeline components were successfully built, tested, and packaged." >> report.md
          cat report.md

      - name: Upload CI report
        uses: actions/upload-artifact@v4
        with:
          name: trusty-pig-cml-report
          path: report.md