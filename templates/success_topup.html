<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Top-Up Successful – FinWallet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to right, #f4f7fa, #e8ecf1);
      opacity: 0;
      animation: fadeIn 0.6s ease-out forwards;
      transition: opacity 0.6s ease-out;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .success-box {
      background-color: white;
      padding: 40px 60px;
      width: 480px;
      max-width: 90%;
      margin: 0px 0px 10px;
      border-radius: 20px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .checkmark-circle {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background-color: #22c55e;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .checkmark-circle svg {
      width: 36px;
      height: 36px;
      stroke: white;
    }

    .title {
      color: #1f2937;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    p {
      font-size: 16px;
      color: #4b5563;
      margin-bottom: 8px;
    }

    .redirect-msg {
      font-size: 14px;
      color: #9ca3af;
      margin-top: 8px;
    }

    .safe-card {
        background-color: #d1fae5;
        color: #065f46;
        padding: 12px 16px;
        border-radius: 12px;
        margin-top: 16px;
        text-align: center;
        font-weight: 600;
        font-size: 14px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        width: 460px;
        max-width: 90%;
        margin-left: auto;
        margin-right: auto;
        }

    .success-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        }

  </style>
</head>
<body>
  <div class="success-wrapper">
    <div class="success-box">
        <div class="checkmark-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        </div>
        <h2 class="title">Top-Up Successful!</h2>
        <p>Your wallet has been credited.</p>
        <div class="redirect-msg">Redirecting back to your wallet...</div>
    </div>

    <div id="fraud-result" class="safe-card"></div>
    </div>



  <script>
    const params = new URLSearchParams(window.location.search);
    const fraud = params.get("fraud");
    const score = params.get("score")*100;

    const resultEl = document.getElementById("fraud-result");
        if (fraud !== null && score !== null) {
        if (fraud === "1") {
            resultEl.innerHTML = `⚠️ This transaction was flagged as suspicious. Risk Score: ${score}`;
            resultEl.style.backgroundColor = "#fee2e2";
            resultEl.style.color = "#b91c1c";
        } else {
            resultEl.innerHTML = `This transaction is safe!<br>Fraud Risk Score: ${score.toFixed(2)}%`;
        }
        }


    setTimeout(() => {
      document.body.style.opacity = 0;
      setTimeout(() => {
        window.location.href = "/wallet";
      }, 600);
    }, 3000);

    
  </script>
</body>
</html>
