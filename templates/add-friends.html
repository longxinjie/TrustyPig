<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Friend – FinWallet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>


  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(to right, #f4f7fa, #e8ecf1);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-container {
      background-color: #4f46e5;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .logo-img {
      width: 300px;
      margin-top: 10px;
      margin-bottom: 8px;
    }

    .avatar-img {
      width: 260px;
      margin-bottom: 0px;
    }

    .form-container h3 {
    font-size: 18px;
      color: white;
      margin-top: 0px;
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      font-size: 14px;
      border-radius: 8px;
      border: none;
      outline: none;
      margin: 10px 0 20px;
    }

    button {
      width: 100%;
      height: 48px;
      background-color: white;
      color: #4f46e5;
      font-weight: 600;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #f0f0f0;
    }

    .status {
      text-align: center;
      margin-top: 20px;
      font-weight: 500;
      padding: 12px 16px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
    }

    .success {
      background-color: #d1fae5;
      color: #065f46;
    }

    .error {
      background-color: #fee2e2;
      color: #b91c1c;
    }
  </style>
</head>

<body class="fade-in">
  <div style="display: flex; flex-direction: column; align-items: center;">
    <div class="form-container">
      <img class="logo-img" src="{{ url_for('static', filename='logo.png') }}" alt="SMU FinWallet Logo" />
      <img class="avatar-img" src="{{ url_for('static', filename='friends.png') }}" alt="Friends Icon" />
      
      <h3>Add a Friend!</h3>
      <input type="text" id="mobile" placeholder="Enter your friend's mobile number." />
      <button onclick="sendFriendRequest()">Send Friend Request</button>
    </div>

    <div id="status" class="status" style="display: none;"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCHs2gr92xsPcPGgpvtlepvSBjYvgSOAgw",
      authDomain: "smu-fintech-mvp-2025.firebaseapp.com",
      projectId: "smu-fintech-mvp-2025"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    firebase.auth().onAuthStateChanged(user => {
    if (!user) {
        // Show "Not signed in" immediately or redirect to login
        document.getElementById("status").style.display = "block";
        document.getElementById("status").className = "status error";
        document.getElementById("status").textContent = "Please log in first!";
    } else {
        window.currentUser = user; // store for later use in sendFriendRequest()
    }
    });

    function sendFriendRequest() {
    const mobile = document.getElementById("mobile").value.trim();
    const statusEl = document.getElementById("status");
    statusEl.style.display = "block";

    if (!mobile.match(/^[89]\d{7}$/)) {
        statusEl.textContent = "Please enter a valid 8-digit SG number.";
        statusEl.className = "status error";
        return;
    }

    const phoneQuery = "+65" + mobile;
    const sender = window.currentUser;

    if (!sender) {
        statusEl.textContent = "Not signed in.";
        statusEl.className = "status error";
        return;
    }

    db.collection("users").where("phone", "==", phoneQuery).get()
        .then(snapshot => {
        if (snapshot.empty) {
            statusEl.textContent = "Account does not exist.";
            statusEl.className = "status error";
        } else {
            const receiverDoc = snapshot.docs[0];
            const receiverUID = receiverDoc.id;

            db.collection("users").doc(sender.uid).get().then(senderDoc => {
            const senderData = senderDoc.data();

            db.collection("users").doc(receiverUID)
                .collection("friend_requests")
                .add({
                from: sender.uid,
                fromPhone: senderData.phone,
                fromName: senderData.name,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                status: "pending"
                }).then(() => {
                statusEl.textContent = `Friend request sent to ${phoneQuery}!! Redirecting...`;
                statusEl.className = "status success";
                setTimeout(() => window.location.href = "/home", 3000);
                });
            });
        }
        })
        .catch(err => {
        console.error(err);
        statusEl.textContent = "Something went wrong.";
        statusEl.className = "status error";
        });
    }

  </script>

  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</body>
</html>
